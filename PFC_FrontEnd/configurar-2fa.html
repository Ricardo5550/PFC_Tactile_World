<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tactile World - Configurar 2FA</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background-color: #16213e;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            width: 320px;
            text-align: center;
        }
        .login-box h2 {
            margin-top: 0;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #e94560;
        }
        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
            background-color: #0f3460;
            color: white;
            outline: none;
            font-size: 14px;
            box-sizing: border-box;
        }
        input::placeholder { color: #8c9eff; }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background-color: #e94560;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        button:hover { background-color: #d13d56; }
        .link-voltar {
            display: inline-block;
            width: 100%;
            background-color: #e94560;
            color: #ffffff;
            padding: 12px 0;
            margin-top: 15px;
            text-align: center;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            text-decoration: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            box-sizing: border-box;
        }
        .link-voltar:hover { background-color: #d13d56; }
        
        /* Estilos específicos para o QR Code */
        #qrCodeContainer {
            display: none; /* Fica oculto até o servidor inserir a imagem */
            margin-top: 20px;
            background-color: white;
            padding: 10px;
            border-radius: 10px;
        }
        #qrCodeImagem { width: 100%; }
        .chave-manual {
            color: #e94560;
            font-weight: bold;
            font-size: 18px;
            letter-spacing: 2px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>ACESSAR POR DOIS FATORES</h2>
        <input type="email" id="emailInput" placeholder="Digite seu E-mail" required>
        <button onclick="gerarQrCode()">GERAR QR CODE</button>
        
        <div id="qrCodeContainer">
            <img id="qrCodeImagem" src="" alt="QR Code 2FA">
            <p style="color: black; margin-bottom: 5px;">Ou use a chave manual:</p>
            <p id="codigoManual" class="chave-manual"></p>
        </div>

        <button onclick="window.location.href='validar-2fa.html'" class="link-recuperar">VALIDAR ACESSO</button>
    </div>

    <script>
        async function gerarQrCode() {
            const emailDigitado = document.getElementById('emailInput').value;
            if (!emailDigitado) {
                alert("Por favor, digite seu e-mail.");
                return;
            }

            try {
                const resposta = await fetch('https://localhost:7094/api/Auth/configurar-2fa', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ Email: emailDigitado })
                });

                if (resposta.ok) {
                    const dados = await resposta.json();
                    
                    // Inserir a imagem e o código na Página Web.
                    document.getElementById('qrCodeImagem').src = dados.qrCodeImagem;
                    document.getElementById('codigoManual').innerText = dados.codigoManual;
                    
                    // Mostrar o espaço branco na Página Web.
                    document.getElementById('qrCodeContainer').style.display = "block";
                    alert("QR Code gerado com sucesso! Escaneie com o Google Authenticator.");
                } else {
                    const textoErro = await resposta.text();
                    alert("ERRO: " + textoErro);
                }
            } catch (erro) {
                alert("Falha grave na comunicação com o servidor.");
            }
        }
    </script>
</body>
</html>
